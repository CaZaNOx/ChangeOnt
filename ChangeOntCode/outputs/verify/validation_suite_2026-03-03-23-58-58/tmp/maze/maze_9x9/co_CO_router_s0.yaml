job:
  family: maze
  mode: maze_9x9
  seed: 0
  agent_id: co_CO_router
  agent_type: co
  agent_name: CO_router
  out_dir: outputs/verify/validation_suite_2026-03-03-23-58-58/maze/maze_9x9/co_CO_router_s0
  runner: experiments.runners.maze_runner
env:
  kind: maze
  spec:
    spec_path: environments/maze1/spec_9x9.yaml
  params:
    width: 5
    height: 5
    seed: 0
agent:
  type: co
  name: CO_router
  params:
    header:
      mode: SSI
    meta_header:
      priors:
        stability_prior: 0.75
        change_prior: 0.25
        classicality_prior: 0.8
        monitoring_floor: 0.05
    elements:
      haq:
        enabled: true
        history_len: 32
        ema_alpha: 0.2
      ghvc:
        enabled: false
      density:
        enabled: false
      change_ops:
        enabled: false
      vote_bridge:
        enabled: true
      action_head:
        enabled: true
        prefer_bus_if_present: true
        use_translator: true
        blend_mode: classic_only
        classic_planner: astar
        co_weight_override: 0.0
        eps_on_cycle: 0.0
        ngram_order: 0
        greedy_explore_bias: 0.0
    primitives:
      co_bus: {}
      P0: {}
      bandit_stats: {}
    groups:
    - id: bridge
      members:
      - vote_bridge
      operator: add
      weight: 0.8
    final_fusion:
      normalize_groups: true
      fallback_to_legacy_bus: true
    combinator:
      order:
      - haq
      - vote_bridge
      - action_head
run:
  steps: null
  episodes: 1
  horizon: null
logging:
  write_metrics: true
  write_budget: true
  write_plot: true
