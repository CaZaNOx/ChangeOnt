job:
  family: maze
  mode: maze_9x9
  seed: 0
  out_dir: outputs/pass3_checks_maze/maze
  agent_id: co_CO_router
  agent_type: co
  agent_name: CO_router
  runner: experiments.runners.maze_runner
env:
  kind: maze
  spec_path: environments/maze1/spec_9x9.yaml
agent:
  type: co
  name: CO_router
  params:
    header:
      mode: SSI
    elements:
      haq:
        enabled: true
        history_len: 64
        ema_alpha: 0.2
      ghvc:
        enabled: false
      density:
        enabled: false
      change_ops:
        enabled: false
      vote_bridge:
        enabled: true
      action_head:
        enabled: true
        prefer_bus_if_present: true
        use_translator: true
        blend_mode: classic_only
        classic_planner: astar
        co_weight_override: 0.0
        eps_on_cycle: 0.0
        ngram_order: 0
        greedy_explore_bias: 0.0
    primitives:
      co_bus: {}
      P0: {}
      bandit_stats: {}
    combinator:
      order:
      - haq
      - vote_bridge
      - action_head
run:
  steps: 0
  episodes: 1
  horizon: 0
logging:
  write_metrics: true
  write_budget: true
  write_plot: true
