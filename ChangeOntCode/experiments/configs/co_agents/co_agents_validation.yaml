# Moderate validation CO variants beyond demo smoke
apply_to_all_families: true
apply_to_all_modes: true

co_agents:
  - type: "co"
    name: "CO_full"
    params:
      header: { mode: "SSI" }
      meta_header:
        priors: { stability_prior: 0.60, change_prior: 0.40, classicality_prior: 0.55, monitoring_floor: 0.05 }
      elements:
        haq:         { enabled: true,  history_len: 64, ema_alpha: 0.2 }
        ghvc:        { enabled: true,  mdl_lambda: 1.0, cooldown: 5, birth_threshold: 2.0 }
        EC_Identity: { enabled: true }
        density:     { enabled: true,  rounding: 2 }
        change_ops:  { enabled: true,  k: 4, mdl_select: true }
        vote_bridge: { enabled: true }
        action_head: { enabled: true, prefer_bus_if_present: true, use_translator: true, blend_mode: "mix", classic_planner: "greedy", co_weight_override: null, eps_on_cycle: 0.10, ngram_order: 2, greedy_explore_bias: 0.10 }
      primitives: { co_bus: {}, P0: {}, bandit_stats: {}, ngram_model: {} }
      groups:
        - { id: "fit_residual", members: ["haq", "ghvc"], operator: "gated", weight: 1.00 }
        - { id: "identity_structure", members: ["EC_Identity", "density", "change_ops"], operator: "add", weight: 0.90 }
        - { id: "bridge", members: ["vote_bridge"], operator: "add", weight: 0.75 }
      final_fusion: { normalize_groups: true, fallback_to_legacy_bus: true }
      combinator: { order: ["haq", "ghvc", "EC_Identity", "density", "change_ops", "vote_bridge", "action_head"] }

  - type: "co"
    name: "CO_router"
    params:
      header: { mode: "SSI" }
      meta_header:
        priors: { stability_prior: 0.75, change_prior: 0.25, classicality_prior: 0.80, monitoring_floor: 0.05 }
      elements:
        haq:         { enabled: true,  history_len: 32, ema_alpha: 0.2 }
        ghvc:        { enabled: false }
        density:     { enabled: false }
        change_ops:  { enabled: false }
        vote_bridge: { enabled: true }
        action_head: { enabled: true, prefer_bus_if_present: true, use_translator: true, blend_mode: "classic_only", classic_planner: "astar", co_weight_override: 0.0, eps_on_cycle: 0.0, ngram_order: 0, greedy_explore_bias: 0.0 }
      primitives: { co_bus: {}, P0: {}, bandit_stats: {} }
      groups:
        - { id: "bridge", members: ["vote_bridge"], operator: "add", weight: 0.80 }
      final_fusion: { normalize_groups: true, fallback_to_legacy_bus: true }
      combinator: { order: ["haq", "vote_bridge", "action_head"] }

